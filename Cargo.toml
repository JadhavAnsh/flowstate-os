[workspace]
members = ["apps/desktop/src-tauri", "crates/flowstate-protocol"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flowstate-protocol = { path = "crates/flowstate-protocol" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
